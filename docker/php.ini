date.timezone="UTC"
expose_php = Off

; Do not emit errors into HTTP responses before Nette configures sessions.
display_errors = Off
display_startup_errors = Off
log_errors = On
output_buffering = 4096
session.auto_start = 0

; Keep warnings/errors visible, but avoid unfixable PHP 8.3 deprecations
; emitted by Jump's locked third-party packages (e.g. PHLAK Config 7).
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
